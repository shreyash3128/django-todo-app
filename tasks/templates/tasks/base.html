{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TaskFlow{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'tasks/style.css' %}" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'tasks:list' %}">
                <i class="bi bi-check2-circle me-2"></i>TaskFlow
            </a>
            <a href="{% url 'tasks:create' %}" class="btn btn-light btn-sm rounded-pill px-3">
                <i class="bi bi-plus-lg me-1"></i>New Task
            </a>
        </div>
    </nav>

    <main class="container py-4">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

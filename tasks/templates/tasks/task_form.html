{% extends 'tasks/base.html' %}

{% block title %}{{ title }} | TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="app-card p-4">
            <h3 class="fw-bold mb-4">
                <i class="bi bi-pencil-square me-2 text-primary"></i>{{ title }}
            </h3>

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="{{ form.title.id_for_label }}" class="form-label fw-semibold">Title</label>
                    {{ form.title }}
                    {% for error in form.title.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>

                <div class="mb-3">
                    <label for="{{ form.description.id_for_label }}" class="form-label fw-semibold">Description</label>
                    {{ form.description }}
                </div>

                <div class="form-check form-switch mb-4">
                    {{ form.completed }}
                    <label class="form-check-label" for="{{ form.completed.id_for_label }}">Mark as completed</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-check-lg me-1"></i>Save
                    </button>
                    <a href="{% url 'tasks:list' %}" class="btn btn-light rounded-pill px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

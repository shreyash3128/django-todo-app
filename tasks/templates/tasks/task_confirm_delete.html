{% extends 'tasks/base.html' %}

{% block title %}Delete Task | TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="app-card p-4 text-center">
            <i class="bi bi-exclamation-triangle display-3 text-danger"></i>
            <h4 class="mt-3">Delete this task?</h4>
            <p class="text-muted">"{{ task.title }}" will be permanently removed.</p>

            <form method="post" class="d-flex justify-content-center gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger rounded-pill px-4">Yes, delete</button>
                <a href="{% url 'tasks:list' %}" class="btn btn-light rounded-pill px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
